name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version metadata
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          header_version="$(awk '/^#define DEFER_VERSION "/ { gsub(/"/, "", $3); print $3; exit }' defer.h)"
          if [ "v${header_version}" != "${tag}" ]; then
            echo "tag ${tag} does not match header version ${header_version}" >&2
            exit 1
          fi
          if ! grep -q "^## \[${header_version}\]" CHANGELOG.md; then
            echo "missing changelog entry for ${header_version}" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          cmake -S . -B build -DDEFER_BUILD_TESTS=ON -DDEFER_BUILD_EXAMPLES=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Prepare release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { printing=1; next }
            printing && $0 ~ "^## \\[" { exit }
            printing { print }
          ' CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "release notes are empty" >&2
            exit 1
          fi

      - name: Copy header
        run: cp defer.h "defer-${GITHUB_REF#refs/tags/}.h"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "defer.h ${{ github.ref_name }}"
          body_path: release_notes.txt
          files: "defer-${{ github.ref_name }}.h"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
