name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION#v}\]/,/^## \[/" CHANGELOG.md \
            | head -n -1 \
            > release_notes.txt
          cat release_notes.txt

      - name: Copy header to release artifact
        run: cp defer.h defer-${{ steps.version.outputs.VERSION }}.h

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "defer.h ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.txt
          files: defer-${{ steps.version.outputs.VERSION }}.h
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
